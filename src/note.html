<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky Note</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="note-window">
    <div class="note-card" id="note-card">
      <div class="note-hover-controls note-top-controls">
        <button class="note-check-btn" id="hide-btn" aria-label="Hide sticky note" title="Hide sticky note">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m6 12 4 4 8-8" />
          </svg>
        </button>
        <button class="icon-btn note-pin-btn" id="pin-btn" aria-label="Lock note position" title="Lock note position" aria-pressed="false">
          <svg class="pin-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M9 4h6" />
            <path d="M10 4l1 7-4 4v2h10v-2l-4-4 1-7" />
            <path d="M12 17v4" />
          </svg>
        </button>
      </div>
      <div class="color-palette hidden" id="color-palette" role="listbox" aria-label="Note color"></div>
      <input id="note-title" placeholder="Title" />
      <div class="note-body-preview" id="note-body-preview" tabindex="0" role="button" aria-label="Edit note body"></div>
      <textarea class="hidden" id="note-body" placeholder="Write something..."></textarea>
      <div class="note-hover-controls note-bottom-toolbar">
        <button class="icon-btn color-picker-btn" id="color-btn" aria-label="Choose note color" title="Choose note color" aria-expanded="false">
          <svg class="palette-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 3a9 9 0 0 0 0 18h1.2a1.8 1.8 0 0 0 1.3-3l-.3-.3a1.8 1.8 0 0 1 1.3-3H17a4 4 0 0 0 4-4c0-4.4-4-7.7-9-7.7z" />
            <circle cx="7.5" cy="10.5" r="1" />
            <circle cx="10.5" cy="7.5" r="1" />
            <circle cx="14.5" cy="7.5" r="1" />
            <circle cx="16.5" cy="11" r="1" />
          </svg>
          <span class="current-color-swatch" id="current-color-swatch" aria-hidden="true"></span>
        </button>
      </div>
      <div class="resize-handle" id="resize-handle"></div>
    </div>

    <script src="./noteFormatting.js"></script>
    <script src="./noteRenderer.js"></script>
  </body>
</html>
