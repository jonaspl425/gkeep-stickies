<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky Notes</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <h1>Sticky Notes</h1>
          <p>Persistent desktop notes for your Google Keep workflow.</p>
          <div class="keep-status-card" id="keep-status-card">
            <span class="keep-status-pill" id="keep-status-pill">Not connected</span>
            <span class="keep-status-text" id="keep-status-text">Connect Google Keep to enable sync controls.</span>
          </div>
        </div>
        <div class="header-actions">
          <button class="secondary" id="connect-keep">Connect Keep</button>
          <button class="secondary" id="disconnect-keep">Disconnect</button>
          <button class="secondary" id="open-keep">Open Google Keep</button>
          <button class="secondary" id="sync-keep">Sync Keep</button>
          <button class="secondary" id="import-notes">Import JSON</button>
          <button class="secondary" id="clear-notes">Clear notes</button>
          <button id="new-note">New note</button>
        </div>
      </header>

      <section class="note-grid" id="notes-list"></section>
    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
